services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: potd
      POSTGRES_PASSWORD: potd
      POSTGRES_DB: potd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potd"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      database_url: postgresql+psycopg2://potd:potd@postgres:5432/potd
      jwt_secret_key: change-me-to-a-long-random-secret
      cors_origins: http://localhost:3000,http://localhost:5173
      upload_dir: /code/uploads
      max_upload_mb: 5
      seed_on_startup: "true"
    volumes:
      - uploads:/code/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
